<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Halftone Press</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #131313;
      --panel: #1b1b1b;
      --line: #333;
      --ink: #ece7dd;
      --dim: #8a8578;
      --cyan: #00b0e8;
      --magenta: #e8368f;
      --yellow: #f4d000;
      --black: #111;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
    }

    .wrap {
      display: grid;
      grid-template-columns: 1fr 340px;
      min-height: 100vh;
    }

    @media (max-width:860px) {
      .wrap {
        grid-template-columns: 1fr;
      }
    }

    /* ---------- header / registration mark ---------- */
    header {
      grid-column: 1/-1;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
    }

    .regmark {
      width: 34px;
      height: 34px;
      position: relative;
      flex: none;
    }

    .regmark svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0;
    }

    header p {
      margin: 0;
      font-size: 12px;
      color: var(--dim);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ---------- stage ---------- */
    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      position: relative;
      background:
        linear-gradient(var(--line) 1px, transparent 1px) 0 0/24px 24px,
        linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/24px 24px;
      background-color: #0f0f0f;
    }

    #dropzone {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 4/3;
      border: 1px dashed var(--line);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      color: var(--dim);
      text-align: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.2);
    }

    #dropzone.drag {
      border-color: var(--cyan);
      color: var(--ink);
    }

    #dropzone .icon {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    #dropzone small {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
    }

    #canvasWrap {
      max-width: 100%;
      max-height: 100%;
      display: none;
      position: relative;
    }

    #canvasWrap.show {
      display: block;
    }

    canvas#out {
      max-width: 100%;
      max-height: 70vh;
      display: block;
      image-rendering: pixelated;
      box-shadow: 0 0 0 1px var(--line);
    }

    #status {
      position: absolute;
      bottom: -26px;
      left: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--dim);
    }

    /* ---------- developing strip (loading state) ---------- */
    .devstrip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .devstrip .dots {
      display: flex;
      gap: 4px;
    }

    .devstrip .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--line);
      animation: devpulse 1.1s ease-in-out infinite;
    }

    .devstrip .dots span:nth-child(1) {
      animation-delay: 0s;
    }

    .devstrip .dots span:nth-child(2) {
      animation-delay: 0.08s;
    }

    .devstrip .dots span:nth-child(3) {
      animation-delay: 0.16s;
    }

    .devstrip .dots span:nth-child(4) {
      animation-delay: 0.24s;
    }

    .devstrip .dots span:nth-child(5) {
      animation-delay: 0.32s;
    }

    .devstrip .dots span:nth-child(6) {
      animation-delay: 0.40s;
    }

    .devstrip .dots span:nth-child(7) {
      animation-delay: 0.48s;
    }

    .devstrip .dots span:nth-child(8) {
      animation-delay: 0.56s;
    }

    @keyframes devpulse {

      0%,
      100% {
        background: var(--line);
        transform: scale(1);
      }

      40% {
        background: var(--ink);
        transform: scale(1.3);
      }
    }

    .devstrip small {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--dim);
      letter-spacing: .06em;
    }

    #renderVeil {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 10, 0.55);
    }

    #renderVeil.show {
      display: flex;
    }

    /* ---------- panel ---------- */
    .panel {
      border-left: 1px solid var(--line);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      overflow-y: auto;
    }

    .section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 12px;
    }

    .field:first-of-type {
      margin-top: 12px;
    }

    .field label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink);
    }

    .field label span.val {
      font-family: 'JetBrains Mono', monospace;
      color: var(--dim);
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 2px;
      background: var(--line);
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--ink);
      cursor: pointer;
      margin-top: -4.5px;
    }

    input[type=range]::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--ink);
      border: none;
      cursor: pointer;
    }

    select,
    input[type=color] {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      padding: 6px 8px;
      border-radius: 2px;
    }

    .mode-row {
      display: flex;
      gap: 6px;
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 8px 4px;
      cursor: pointer;
      border-radius: 2px;
    }

    .mode-btn.active {
      color: var(--bg);
      background: var(--ink);
      border-color: var(--ink);
    }

    .plate-angles {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .plate-angle {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
    }

    .plate-angle input[type=range] {
      flex: 1;
    }

    .plate-angle .deg {
      width: 34px;
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--dim);
    }

    .mono-colors {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .mono-colors .field {
      flex: 1;
      margin-top: 0;
    }

    #shapeToggle {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    button.dl {
      width: 100%;
      padding: 12px;
      background: var(--ink);
      color: var(--bg);
      border: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
    }

    button.dl:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    button.reset {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 8px;
      cursor: pointer;
      border-radius: 2px;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="regmark">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="17" fill="none" stroke="var(--dim)" stroke-width="1" />
          <line id="regC" x1="20" y1="3" x2="20" y2="37" stroke="var(--cyan)" stroke-width="1" />
          <line id="regM" x1="20" y1="3" x2="20" y2="37" stroke="var(--magenta)" stroke-width="1" />
          <line id="regY" x1="20" y1="3" x2="20" y2="37" stroke="var(--yellow)" stroke-width="1" />
          <line id="regK" x1="20" y1="3" x2="20" y2="37" stroke="var(--ink)" stroke-width="1" />
        </svg>
      </div>
      <div>
        <h1>Halftone Press</h1>
        <p>screened dots, in real time — no server, no upload</p>
      </div>
    </header>

    <div class="stage">
      <div id="dropzone">
        <div class="icon" id="dropzoneIcon">Drop an image, or click</div>
        <small id="dropzoneSub">processed entirely in your browser</small>
        <div class="devstrip" id="devstrip" style="display:none;">
          <div class="dots">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <small>developing</small>
        </div>
      </div>
      <div id="canvasWrap">
        <canvas id="out"></canvas>
        <div id="renderVeil">
          <div class="devstrip">
            <div class="dots">
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <small id="veilLabel">developing</small>
          </div>
        </div>
        <div id="status"></div>
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="panel">

      <div>
        <div class="section-title">Source</div>
        <div class="field">
          <label>Output width <span class="val" id="widthVal">640px</span></label>
          <input type="range" id="width" min="200" max="1200" value="640" step="10">
        </div>
        <button class="reset" id="changeImg" style="margin-top:10px;">Choose different image</button>
      </div>

      <div>
        <div class="section-title">Screen</div>
        <div class="field">
          <label>Dot pitch <span class="val" id="pitchVal">3px</span></label>
          <input type="range" id="pitch" min="3" max="24" value="3" step="1">
        </div>
        <div class="field">
          <label>Dot gain <span class="val" id="gainVal">1.15×</span></label>
          <input type="range" id="gain" min="0.7" max="1.6" value="1.15" step="0.01">
        </div>
      </div>

      <div>
        <div class="section-title">Plates</div>
        <div class="mode-row" id="modeRow">
          <button class="mode-btn active" data-mode="cmyk">CMYK</button>
          <button class="mode-btn" data-mode="rgb">RGB</button>
          <button class="mode-btn" data-mode="mono">Mono</button>
        </div>

        <div class="plate-angles" id="cmykAngles">
          <div class="plate-angle"><span class="swatch" style="background:var(--cyan)"></span>
            <input type="range" min="0" max="90" value="15" data-plate="c"><span class="deg">15°</span>
          </div>
          <div class="plate-angle"><span class="swatch" style="background:var(--magenta)"></span>
            <input type="range" min="0" max="90" value="75" data-plate="m"><span class="deg">75°</span>
          </div>
          <div class="plate-angle"><span class="swatch" style="background:var(--yellow)"></span>
            <input type="range" min="0" max="90" value="0" data-plate="y"><span class="deg">0°</span>
          </div>
          <div class="plate-angle"><span class="swatch" style="background:var(--ink)"></span>
            <input type="range" min="0" max="90" value="45" data-plate="k"><span class="deg">45°</span>
          </div>
        </div>

        <div class="plate-angles" id="rgbAngles" style="display:none;">
          <div class="plate-angle"><span class="swatch" style="background:#ff3b3b"></span>
            <input type="range" min="0" max="90" value="15" data-plate="r"><span class="deg">15°</span>
          </div>
          <div class="plate-angle"><span class="swatch" style="background:#3bff6a"></span>
            <input type="range" min="0" max="90" value="75" data-plate="g"><span class="deg">75°</span>
          </div>
          <div class="plate-angle"><span class="swatch" style="background:#3b8bff"></span>
            <input type="range" min="0" max="90" value="45" data-plate="b"><span class="deg">45°</span>
          </div>
        </div>

        <div id="monoAngles" style="display:none;">
          <div class="field">
            <label>Screen angle <span class="val" id="monoAngleVal">45°</span></label>
            <input type="range" id="monoAngle" min="0" max="90" value="45" step="1">
          </div>
          <div class="mono-colors">
            <div class="field">
              <label>Ink</label>
              <input type="color" id="inkColor" value="#111111">
            </div>
            <div class="field">
              <label>Paper</label>
              <input type="color" id="paperColor" value="#ece7dd">
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="section-title">Output</div>
        <button class="dl" id="download" disabled>Download PNG</button>
      </div>

    </div>
  </div>

  <script>
    (() => {
      const dropzone = document.getElementById('dropzone');
      const canvasWrap = document.getElementById('canvasWrap');
      const fileInput = document.getElementById('fileInput');
      const changeImg = document.getElementById('changeImg');
      const out = document.getElementById('out');
      const octx = out.getContext('2d');
      const statusEl = document.getElementById('status');
      const downloadBtn = document.getElementById('download');

      let srcImg = null;
      let srcCanvas = document.createElement('canvas');
      let srcCtx = srcCanvas.getContext('2d', {willReadFrequently: true});
      let raf = null;

      // ---- controls ----
      const widthSlider = document.getElementById('width');
      const widthVal = document.getElementById('widthVal');
      const pitchSlider = document.getElementById('pitch');
      const pitchVal = document.getElementById('pitchVal');
      const gainSlider = document.getElementById('gain');
      const gainVal = document.getElementById('gainVal');
      const modeButtons = document.querySelectorAll('.mode-btn');
      const cmykAngles = document.getElementById('cmykAngles');
      const rgbAngles = document.getElementById('rgbAngles');
      const monoAngles = document.getElementById('monoAngles');
      const monoAngleSlider = document.getElementById('monoAngle');
      const monoAngleVal = document.getElementById('monoAngleVal');
      const inkColor = document.getElementById('inkColor');
      const paperColor = document.getElementById('paperColor');

      let mode = 'cmyk';
      const plateAngles = {c: 15, m: 75, y: 0, k: 45, r: 15, g: 75, b: 45};

      const renderVeil = document.getElementById('renderVeil');
      const SLOW_MS = 70; // only bother showing the veil if the last render took longer than this
      let lastRenderMs = 0;
      let renderToken = 0; // bumped on every new schedule; in-flight chunked renders check this and bail out if stale

      // single render path, throttled to one per animation frame — rAF already
      // coalesces rapid slider events, so no artificial delay is needed on top
      function scheduleRender() {
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(runRender);
      }

      function runRender() {
        const myToken = ++renderToken;
        if (lastRenderMs > SLOW_MS) {
          renderVeil.classList.add('show');
          requestAnimationFrame(() => render(myToken));
        } else {
          render(myToken);
        }
      }

      // kept as an alias so existing call sites read clearly
      const markDragging = scheduleRender;
      const scheduleFinalRender = scheduleRender;

      // ---- file loading ----
      const dropzoneIcon = document.getElementById('dropzoneIcon');
      const dropzoneSub = document.getElementById('dropzoneSub');
      const devstrip = document.getElementById('devstrip');

      function loadFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        dropzoneIcon.style.display = 'none';
        dropzoneSub.style.display = 'none';
        devstrip.style.display = 'flex';

        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          srcImg = img;
          dropzone.style.display = 'none';
          canvasWrap.classList.add('show');
          downloadBtn.disabled = false;
          scheduleFinalRender();
          URL.revokeObjectURL(url);
          // reset dropzone for next time
          dropzoneIcon.style.display = '';
          dropzoneSub.style.display = '';
          devstrip.style.display = 'none';
        };
        img.onerror = () => {
          dropzoneIcon.textContent = 'Could not read that file — try another image';
          dropzoneIcon.style.display = '';
          dropzoneSub.style.display = '';
          devstrip.style.display = 'none';
        };
        img.src = url;
      }

      dropzone.addEventListener('click', () => fileInput.click());
      changeImg.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

      ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, e => {
        e.preventDefault(); dropzone.classList.add('drag');
      }));
      ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, e => {
        e.preventDefault(); dropzone.classList.remove('drag');
      }));
      dropzone.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

      // ---- UI wiring ----
      widthSlider.addEventListener('input', () => {
        widthVal.textContent = widthSlider.value + 'px';
        markDragging();
      });
      pitchSlider.addEventListener('input', () => {
        pitchVal.textContent = pitchSlider.value + 'px';
        markDragging();
      });
      gainSlider.addEventListener('input', () => {
        gainVal.textContent = parseFloat(gainSlider.value).toFixed(2) + '×';
        markDragging();
      });

      modeButtons.forEach(btn => btn.addEventListener('click', () => {
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        cmykAngles.style.display = mode === 'cmyk' ? 'flex' : 'none';
        rgbAngles.style.display = mode === 'rgb' ? 'flex' : 'none';
        monoAngles.style.display = mode === 'mono' ? 'block' : 'none';
        scheduleFinalRender();
      }));

      document.querySelectorAll('[data-plate]').forEach(inp => {
        inp.addEventListener('input', () => {
          plateAngles[inp.dataset.plate] = parseFloat(inp.value);
          inp.nextElementSibling.textContent = inp.value + '°';
          updateRegMark();
          markDragging();
        });
      });
      monoAngleSlider.addEventListener('input', () => {
        monoAngleVal.textContent = monoAngleSlider.value + '°';
        markDragging();
      });
      inkColor.addEventListener('input', markDragging);
      paperColor.addEventListener('input', markDragging);

      function updateRegMark() {
        document.getElementById('regC').setAttribute('transform', `rotate(${plateAngles.c} 20 20)`);
        document.getElementById('regM').setAttribute('transform', `rotate(${plateAngles.m} 20 20)`);
        document.getElementById('regY').setAttribute('transform', `rotate(${plateAngles.y} 20 20)`);
        document.getElementById('regK').setAttribute('transform', `rotate(${plateAngles.k} 20 20)`);
      }
      updateRegMark();

      // ---- color helpers ----
      function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }

      // ---- core render ----
      const CHUNK_BUDGET_MS = 8; // draw for roughly this long, then hand control back to the browser

      function yieldToBrowser() {
        return new Promise(resolve => requestAnimationFrame(resolve));
      }

      async function drawPlate(ctx, angleDeg, colorRgb, inkFn, targetW, targetH, sample, pitch, maxR, myToken) {
        const rad = angleDeg * Math.PI / 180;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        const cx = targetW / 2, cy = targetH / 2;
        const diag = Math.sqrt(targetW * targetW + targetH * targetH) / 2 + pitch;
        const steps = Math.ceil(diag / pitch);

        ctx.fillStyle = `rgb(${colorRgb[0]},${colorRgb[1]},${colorRgb[2]})`;
        ctx.beginPath();
        let chunkStart = performance.now();

        for (let i = -steps; i <= steps; i++) {
          for (let j = -steps; j <= steps; j++) {
            const gx = i * pitch, gy = j * pitch;
            const x = cx + gx * cos - gy * sin;
            const y = cy + gx * sin + gy * cos;
            if (x < -pitch || y < -pitch || x > targetW + pitch || y > targetH + pitch) continue;
            const [r, g, b] = sample(x, y);
            const amount = inkFn(r, g, b);
            if (amount <= 0.02) continue;
            const rr = amount * maxR;
            ctx.moveTo(x + rr, y);
            ctx.arc(x, y, rr, 0, Math.PI * 2);

            if (performance.now() - chunkStart > CHUNK_BUDGET_MS) {
              ctx.fill();
              if (myToken !== renderToken) return false; // a newer render was requested — abandon this one
              await yieldToBrowser();
              ctx.beginPath();
              chunkStart = performance.now();
            }
          }
        }
        ctx.fill();
        return myToken === renderToken;
      }

      async function render(myToken) {
        if (!srcImg) return;
        const t0 = performance.now();

        const targetW = parseInt(widthSlider.value, 10);
        const scale = targetW / srcImg.width;
        const targetH = Math.round(srcImg.height * scale);

        srcCanvas.width = targetW;
        srcCanvas.height = targetH;
        srcCtx.drawImage(srcImg, 0, 0, targetW, targetH);
        const data = srcCtx.getImageData(0, 0, targetW, targetH).data;

        function sample(x, y) {
          x = Math.max(0, Math.min(targetW - 1, x | 0));
          y = Math.max(0, Math.min(targetH - 1, y | 0));
          const i = (y * targetW + x) * 4;
          return [data[i], data[i + 1], data[i + 2]];
        }

        out.width = targetW;
        out.height = targetH;

        const pitch = parseFloat(pitchSlider.value);
        const gain = parseFloat(gainSlider.value);
        const maxR = (pitch / 2) * gain;

        let ok = true;

        if (mode === 'mono') {
          const ink = hexToRgb(inkColor.value);
          const paper = hexToRgb(paperColor.value);
          octx.fillStyle = `rgb(${paper[0]},${paper[1]},${paper[2]})`;
          octx.fillRect(0, 0, targetW, targetH);
          ok = await drawPlate(octx, parseFloat(monoAngleSlider.value), ink, (r, g, b) => {
            const lum = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
            return 1 - lum;
          }, targetW, targetH, sample, pitch, maxR, myToken);
        } else {
          octx.fillStyle = '#fff';
          octx.fillRect(0, 0, targetW, targetH);

          const plate = document.createElement('canvas');
          plate.width = targetW; plate.height = targetH;
          const pctx = plate.getContext('2d');

          const jobs = mode === 'cmyk' ? [
            {angle: plateAngles.c, color: [0, 174, 239], fn: (r, g, b) => 1 - r / 255},
            {angle: plateAngles.m, color: [236, 0, 140], fn: (r, g, b) => 1 - g / 255},
            {angle: plateAngles.y, color: [255, 241, 0], fn: (r, g, b) => 1 - b / 255},
            {angle: plateAngles.k, color: [35, 31, 32], fn: (r, g, b) => 1 - Math.max(r, g, b) / 255},
          ] : [
            {angle: plateAngles.r, color: [255, 60, 60], fn: (r, g, b) => 1 - r / 255},
            {angle: plateAngles.g, color: [60, 220, 110], fn: (r, g, b) => 1 - g / 255},
            {angle: plateAngles.b, color: [70, 140, 255], fn: (r, g, b) => 1 - b / 255},
          ];

          for (const job of jobs) {
            pctx.clearRect(0, 0, targetW, targetH);
            pctx.fillStyle = '#fff';
            pctx.fillRect(0, 0, targetW, targetH);
            ok = await drawPlate(pctx, job.angle, job.color, job.fn, targetW, targetH, sample, pitch, maxR, myToken);
            if (!ok || myToken !== renderToken) break;
            octx.globalCompositeOperation = 'multiply';
            octx.drawImage(plate, 0, 0);
          }
          octx.globalCompositeOperation = 'source-over';
        }

        if (myToken !== renderToken) {
          renderVeil.classList.remove('show');
          return; // superseded mid-flight — don't report timing or clear the veil for a render nobody asked for
        }

        const ms = Math.round(performance.now() - t0);
        lastRenderMs = ms;
        statusEl.textContent = `${targetW}×${targetH}px · pitch ${pitch}px · ${ms}ms`;
        renderVeil.classList.remove('show');
      }

      downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'halftone.png';
        link.href = out.toDataURL('image/png');
        link.click();
      });

    })();
  </script>
</body>

</html>
